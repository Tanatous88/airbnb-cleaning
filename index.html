<style>
:root {
  --ground: #FAF7F5; --card: #FFFFFF; --ink: #241F1D; --muted: #7C716C; --faint: #B5AAA4;
  --line: #EDE6E2; --chip-bg: #F3EDE9; --accent: #E8484E; --accent-ink: #FFFFFF;
  --good: #1E7D5F; --good-bg: #E4F3EC; --warn: #A86A12; --warn-bg: #FBF0DC;
  --urgent: #C22B31; --urgent-bg: #FBE7E7; --shadow: 0 1px 4px rgba(60,40,30,0.08);
  --u-fun: #E8484E; --u-garage: #00857C; --u-nook: #7B3FA0;
  --u-cosmo: #D97706; --u-cows: #3B8A3F; --u-cottage: #4F5BB3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #191514; --card: #221D1B; --ink: #F1EAE6; --muted: #A2968F; --faint: #6E635D;
    --line: #322B28; --chip-bg: #2C2522; --accent: #FF6B70; --accent-ink: #2A1213;
    --good: #4CC79A; --good-bg: #16302A; --warn: #E5A44A; --warn-bg: #33270F;
    --urgent: #FF7A7E; --urgent-bg: #3A1A1B; --shadow: 0 1px 5px rgba(0,0,0,0.4);
    --u-fun: #FF6B70; --u-garage: #2BB3A8; --u-nook: #B579DB;
    --u-cosmo: #F09B3E; --u-cows: #5FB963; --u-cottage: #8891E0;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--ground); color: var(--ink); min-height: 100vh; font-size: 15px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 14px 40px; }
.topbar { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
.topbar-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 17px; }
.brand h1 { font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.open-count { flex-shrink: 0; text-align: center; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 5px 11px; font-weight: 700; font-size: 12px; line-height: 1.2; }
.open-count.zero { background: var(--good-bg); color: var(--good); }
.open-count .n { font-family: "Bricolage Grotesque", sans-serif; display: block; font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.section-head { display: flex; align-items: baseline; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 22px 2px 9px; }
.section-head .rule { flex: 1; height: 1px; background: var(--line); align-self: center; }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 15px 15px 18px; margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--uc, var(--faint)); }
.card.done { opacity: 0.82; }
.card-top { display: flex; align-items: flex-start; gap: 12px; }
.date-badge { flex-shrink: 0; min-width: 52px; text-align: center; background: var(--chip-bg); border-radius: 11px; padding: 7px 8px 6px; }
.date-badge .dn { font-family: "Bricolage Grotesque", sans-serif; font-size: 23px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.date-badge .dd { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 3px; }
.card-info { flex: 1; min-width: 0; }
.unit-row { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.unit-name { font-family: "Bricolage Grotesque", sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.badge { border-radius: 99px; padding: 2px 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; }
.badge.repeat { background: var(--warn-bg); color: var(--warn); }
.badge.dirty { background: var(--urgent-bg); color: var(--urgent); text-transform: uppercase; letter-spacing: 0.06em; }
.badge.urgent { background: var(--urgent); color: #fff; text-transform: uppercase; letter-spacing: 0.06em; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { .badge.urgent { animation: none; } }
.guest { font-size: 13px; color: var(--muted); margin-top: 3px; }
.guest b { color: var(--ink); font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 5px; font-size: 12px; color: var(--muted); }
.avail { color: var(--good); font-weight: 650; }
.pill { display: inline-block; background: var(--chip-bg); border-radius: 99px; padding: 1px 8px; font-size: 11.5px; color: var(--muted); }
.status { display: flex; align-items: center; gap: 8px; margin-top: 11px; border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 600; }
.status.ok { background: var(--good-bg); color: var(--good); }
.status.wait { background: var(--warn-bg); color: var(--warn); }
.status .when { font-weight: 400; opacity: 0.8; margin-left: auto; font-size: 12px; }
.signup-btn { display: block; margin-top: 11px; padding: 12px; border-radius: 10px; text-align: center; text-decoration: none; font-size: 15px; font-weight: 700; color: #fff; background: var(--uc, var(--accent)); transition: filter 0.15s; }
.signup-btn:hover { filter: brightness(1.08); }
.signup-btn:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.signup-btn.urgent-btn { background: var(--urgent); }
.done-btn { display: block; margin-top: 8px; padding: 11px; border-radius: 10px; text-align: center; text-decoration: none; font-size: 14.5px; font-weight: 700; color: var(--good); background: var(--good-bg); border: 1.5px solid var(--good); transition: filter 0.15s; }
.done-btn:hover { filter: brightness(1.05); }
.day-label { font-size: 12px; font-weight: 700; color: var(--faint); margin: 14px 4px 6px; letter-spacing: 0.04em; }
.board { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px; box-shadow: var(--shadow); }
.board-cap { font-size: 13px; color: var(--muted); }
.board-row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
.board-name { width: 76px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.board-bar-track { flex: 1; height: 10px; border-radius: 99px; background: var(--chip-bg); overflow: hidden; }
.board-bar { height: 100%; border-radius: 99px; background: var(--accent); }
.board-n { width: 20px; text-align: right; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 15px; }
.updated { text-align: center; font-size: 11.5px; color: var(--faint); margin-top: 22px; }
</style>
</head>

<script>
var FORM_BASE = 'https://docs.google.com/forms/d/e/1FAIpQLSeeZfcvmwMFtXNadTH8kw542rXb0KxQWID0tbShL5nuqZrmXg/viewform';
var UNIT_ENTRY = 'entry.1764140552';
var DATE_ENTRY = 'entry.493844947';
var DONE_URL = 'https://script.google.com/macros/s/AKfycbyEdAWFJSwaIyzsfxIuwX4A19KaicPDNWkG2xo066-1zXQrsG2CQSjQtAmxucHD40pF/exec';
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var UNIT_VARS = { 'Fun Music': '--u-fun', 'Garage Studio': '--u-garage', 'Midnight Nook': '--u-nook', 'Cosmo': '--u-cosmo', 'Mini Cows': '--u-cows', 'The Cottage': '--u-cottage' };

function signupUrl(unit, dateISO) { return FORM_BASE + '?usp=pp_url&' + UNIT_ENTRY + '=' + encodeURIComponent(unit) + '&' + DATE_ENTRY + '=' + dateISO; }
function doneUrl(e) { return DONE_URL.indexOf('https://') === 0 ? DONE_URL + '?u=' + encodeURIComponent(e.unit) + '&d=' + e.dateISO + '&n=' + encodeURIComponent(e.cleaner || '') : ''; }
function doneBtn(e) {
  if (!e.cleaner || e.confirmed || (e.cleanFrom && e.cleanFrom > window.CLEANING_DATA.todayISO)) return '';
  var u = doneUrl(e);
  return u ? '<a class="done-btn" href="' + u + '" target="_blank" rel="noopener">&#10003; Mark done &middot; ' + esc(e.unit) + '</a>' : '';
}
function unitVar(n) { return 'var(' + (UNIT_VARS[n] || '--faint') + ')'; }
function utc(iso) { return Date.UTC(parseInt(iso.substring(0,4),10), parseInt(iso.substring(5,7),10)-1, parseInt(iso.substring(8,10),10)); }
function addDays(iso, n) { var t = new Date(utc(iso) + n*86400000); return t.getUTCFullYear() + '-' + ('0'+(t.getUTCMonth()+1)).slice(-2) + '-' + ('0'+t.getUTCDate()).slice(-2); }
function dayNum(iso) { return parseInt(iso.substring(8,10),10); }
function dayName(iso) { return DAYS[new Date(utc(iso)).getUTCDay()]; }
function pretty(iso) { return MONTHS[parseInt(iso.substring(5,7),10)-1] + ' ' + dayNum(iso); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function dateBadge(e) { return '<div class="date-badge"><div class="dn">' + dayNum(e.dateISO) + '</div><div class="dd">' + dayName(e.dateISO) + '</div></div>'; }

function metaBits(e) {
  var bits = [];
  if (e.party) bits.push('<span class="pill">' + esc(e.party) + '</span>');
  if (e.availRange) bits.push('<span class="avail">Available to clean: ' + esc(e.availRange) + '</span>');
  return bits.length ? '<div class="meta">' + bits.join('') + '</div>' : '';
}

function todayCard(e) {
  var h = '<div class="card" style="--uc:' + unitVar(e.unit) + '"><div class="card-top">' + dateBadge(e) + '<div class="card-info">';
  h += '<div class="unit-row"><span class="unit-name">' + esc(e.unit) + '</span>';
  if (!e.cleaner) h += '<span class="badge urgent">No cleaner</span>';
  if (e.repeat) h += '<span class="badge repeat">&#11088; Repeat guest</span>';
  h += '</div><div class="guest">Next guest: <b>' + esc(e.guest) + '</b> &middot; checks in today</div>' + metaBits(e) + '</div></div>';
  if (!e.cleaner) {
    h += '<a class="signup-btn urgent-btn" href="' + signupUrl(e.unit, e.dateISO) + '" target="_blank" rel="noopener">Claim today&#39;s clean &middot; ' + esc(e.unit) + '</a>';
  } else if (e.confirmed) {
    h += '<div class="status ok"><span>&#9989;</span> Cleaned by ' + esc(e.cleaner) + ' <span class="when">confirmed</span></div>';
  } else {
    h += '<div class="status wait"><span>&#8987;</span> Assigned to ' + esc(e.cleaner) + ' <span class="when">not marked done yet</span></div>';
    h += doneBtn(e);
  }
  return h + '</div>';
}

function openCard(e, urgent) {
  var h = '<div class="card" style="--uc:' + unitVar(e.unit) + '"><div class="card-top">' + dateBadge(e) + '<div class="card-info">';
  h += '<div class="unit-row"><span class="unit-name">' + esc(e.unit) + '</span>';
  if (urgent) h += '<span class="badge urgent">48 hrs</span>';
  if (e.repeat) h += '<span class="badge repeat">&#11088; Repeat guest</span>';
  h += '</div><div class="guest"><b>' + esc(e.guest) + '</b> checks in';
  if (e.stayRange) h += ' &middot; ' + esc(e.stayRange) + (e.nights ? ' &middot; ' + e.nights + ' night' + (e.nights === 1 ? '' : 's') : '');
  h += '</div>' + metaBits(e) + '</div></div>';
  h += '<a class="signup-btn' + (urgent ? ' urgent-btn' : '') + '" href="' + signupUrl(e.unit, e.dateISO) + '" target="_blank" rel="noopener">Sign up &middot; ' + esc(e.unit) + '</a></div>';
  return h;
}

function dirtyCard(e, todayISO) {
  var h = '<div class="card' + (e.scheduledBy ? ' done' : '') + '" style="--uc:' + unitVar(e.unit) + '"><div class="card-top">' + dateBadge(e) + '<div class="card-info">';
  h += '<div class="unit-row"><span class="unit-name">' + esc(e.unit) + '</span>';
  h += '<span class="badge ' + (e.scheduledBy ? 'repeat' : 'dirty') + '">' + (e.scheduledBy ? 'Clean booked' : 'Needs clean') + '</span>';
  h += '</div><div class="guest">Guest checked out <b>' + pretty(e.dateISO) + '</b>';
  if (e.days > 0) h += ' &middot; vacant ' + e.days + ' day' + (e.days === 1 ? '' : 's');
  h += '</div><div class="meta">';
  if (e.nextDateISO) h += '<span class="pill">Next guest ' + pretty(e.nextDateISO) + (e.nextDays > 0 ? ' &middot; ' + e.nextDays + ' days away' : '') + '</span>';
  else h += '<span class="pill">No upcoming stay booked</span>';
  if (!e.scheduledBy) h += '<span class="avail">Available to clean: any day</span>';
  h += '</div></div></div>';
  if (e.scheduledBy) {
    h += '<div class="status wait"><span>&#128197;</span> ' + esc(e.scheduledBy) + ' signed up for ' + pretty(e.scheduledOn) + '</div>';
  } else {
    h += '<a class="signup-btn" href="' + signupUrl(e.unit, todayISO) + '" target="_blank" rel="noopener">Clean it &middot; ' + esc(e.unit) + '</a>';
  }
  return h + '</div>';
}

function assignedCard(e) {
  var h = '<div class="card done" style="--uc:' + unitVar(e.unit) + '"><div class="card-top">' + dateBadge(e) + '<div class="card-info">';
  h += '<div class="unit-row"><span class="unit-name">' + esc(e.unit) + '</span>';
  if (e.repeat) h += '<span class="badge repeat">&#11088; Repeat guest</span>';
  h += '</div><div class="guest"><b>' + esc(e.guest) + '</b> checks in';
  if (e.stayRange) h += ' &middot; ' + esc(e.stayRange) + (e.nights ? ' &middot; ' + e.nights + ' night' + (e.nights === 1 ? '' : 's') : '');
  h += '</div>' + metaBits(e) + '</div></div>';
  if (e.confirmed) h += '<div class="status ok"><span>&#10024;</span> Cleaned by ' + esc(e.cleaner) + ' <span class="when">done</span></div></div>';
  else h += '<div class="status ok"><span>&#9989;</span> ' + esc(e.cleaner) + '&#39;s got it</div>' + doneBtn(e) + '</div>';
  return h;
}

function sectionHead(label) { return '<div class="section-head">' + label + ' <span class="rule"></span></div>'; }

function render() {
  var D = window.CLEANING_DATA;
  var todayISO = D.todayISO;
  var events = (D.events || []).slice().sort(function (a, b) { return a.dateISO < b.dateISO ? -1 : a.dateISO > b.dateISO ? 1 : 0; });
  var today = events.filter(function (e) { return e.dateISO === todayISO; });
  var upcoming = events.filter(function (e) { return e.dateISO > todayISO; });
  var openUp = upcoming.filter(function (e) { return !e.cleaner; });
  var claimedUp = upcoming.filter(function (e) { return e.cleaner; });
  var openAll = today.filter(function (e) { return !e.cleaner; }).concat(openUp);
  var dirty = (D.dirty || []).slice().sort(function (a, b) { return a.dateISO < b.dateISO ? -1 : a.dateISO > b.dateISO ? 1 : 0; });
  var dirtyOpen = dirty.filter(function (e) { return !e.scheduledBy; });
  var urgentCutoff = addDays(todayISO, 2);
  var tomorrowISO = addDays(todayISO, 1);

  var totalOpen = openAll.length + dirtyOpen.length;
  var oc = document.getElementById('opencount');
  oc.className = 'open-count' + (totalOpen ? '' : ' zero');
  oc.innerHTML = '<span class="n">' + totalOpen + '</span>' + (totalOpen ? 'open job' + (totalOpen === 1 ? '' : 's') : 'all covered');

  var sub;
  if (dirtyOpen.length) sub = dirtyOpen.length + ' vacant unit' + (dirtyOpen.length === 1 ? '' : 's') + ' ready to clean now';
  else if (!openAll.length) sub = 'Every turnover has a cleaner';
  else {
    var first = openAll[0];
    var when = first.dateISO === todayISO ? 'today' : first.dateISO === tomorrowISO ? 'tomorrow' : dayName(first.dateISO) + ' ' + pretty(first.dateISO);
    sub = 'Next open slot: ' + when + ' &middot; ' + esc(first.unit);
  }
  document.getElementById('subtitle').innerHTML = sub;

  var html = '';
  if (!events.length && !dirty.length) {
    html = '<div class="empty">No check-ins in the next two weeks. Check back soon!</div>';
  } else {
    if (today.length) {
      html += sectionHead('Today &middot; ' + dayName(todayISO) + ' ' + pretty(todayISO));
      html += today.map(function (e) { return todayCard(e); }).join('');
    }
    if (dirty.length) {
      html += sectionHead('Needs cleaning now');
      html += dirty.map(function (e) { return dirtyCard(e, todayISO); }).join('');
    }
    if (openUp.length) {
      html += sectionHead('Needs a cleaner');
      var lastDate = '';
      openUp.forEach(function (e) {
        if (e.dateISO !== lastDate) {
          lastDate = e.dateISO;
          var lbl = e.dateISO === tomorrowISO ? 'Tomorrow &middot; ' + dayName(e.dateISO) + ' ' + pretty(e.dateISO) : dayName(e.dateISO) + ' ' + pretty(e.dateISO);
          html += '<div class="day-label">' + lbl + '</div>';
        }
        html += openCard(e, e.dateISO <= urgentCutoff);
      });
    }
    if (claimedUp.length) {
      html += sectionHead('Already assigned');
      html += claimedUp.map(function (e) { return assignedCard(e); }).join('');
    }
  }
  var board = (D.board || []).slice().sort(function (a, b) { return b.n - a.n; }).slice(0, 6);
  if (board.length) {
    var max = board[0].n || 1;
    html += sectionHead(MONTHS_FULL[parseInt(todayISO.substring(5,7),10)-1] + ' leaderboard');
    html += '<div class="board"><div class="board-cap">Cleans completed this month</div>';
    board.forEach(function (r, i) {
      var w = Math.max(8, Math.round(100 * r.n / max));
      var op = Math.max(0.45, 1 - i * 0.14);
      html += '<div class="board-row"><span class="board-name">' + (i === 0 ? '&#128081; ' : '') + esc(r.name) + '</span><div class="board-bar-track"><div class="board-bar" style="width:' + w + '%; opacity:' + op + '"></div></div><span class="board-n">' + r.n + '</span></div>';
    });
    html += '</div>';
  }
  html += '<p class="updated">Last updated: ' + esc(D.generatedAt) + ' &middot; refreshes automatically</p>';
  document.getElementById('content').innerHTML = html;
}
render();
</script>
</body>
</html>
